<title>Prototipe UI — LMS Akademi Online</title>

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root {
  /* dark is the product's native ground */
  --bg:          #0b0b0e;
  --surface:     #17181c;
  --raised:      #212228;
  --raised-2:    #2a2b33;
  --line:        #2c2d34;
  --line-soft:   #232429;
  --text:        #f2f2f5;
  --text-2:      #b6b6c1;
  --muted:       #8b8b98;
  --accent:      #2563eb;   /* isian: batang, tombol, latar solid */
  --accent-hot:  #4b86f5;   /* isian aktif/hover */
  --accent-text: #8ec2ff;   /* teks aksen di atas latar bertint */
  --accent-ink:  #ffffff;
  --accent-soft: rgba(37, 99, 235, 0.18);
  --good:        #3ddc97;
  --good-soft:   rgba(61, 220, 151, 0.12);
  --warn:        #f5a524;
  --warn-soft:   rgba(245, 165, 36, 0.13);
  --danger:      #ff5c7f;   /* dipakai sebagai teks */
  --danger-soft: rgba(255, 92, 127, 0.13);
  --danger-solid:#c01743;   /* isian solid dengan teks putih */
  --gold:        #e8b44a;
  --gold-soft:   rgba(232, 180, 74, 0.12);
  --silver:      #b9bcc6;
  --bronze:      #cd8b5e;
  --pts:         #8ec2ff;
  --shadow:      0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-pill: 999px;

  --rail: 64px;
  --side: 280px;
  --topbar: 60px;

  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg:          #f4f4f7;
    --surface:     #ffffff;
    --raised:      #ffffff;
    --raised-2:    #eeeef3;
    --line:        #e2e2ea;
    --line-soft:   #ececf2;
    --text:        #16161c;
    --text-2:      #45454f;
    --muted:       #6f6f7d;
    --accent:      #0f5bd1;
    --accent-hot:  #1d6ae5;
    --accent-text: #0f5bd1;
    --accent-soft: rgba(15, 91, 209, 0.10);
    --good:        #0f7a52;
    --good-soft:   rgba(15, 122, 82, 0.12);
    --warn:        #8a5200;
    --warn-soft:   rgba(138, 82, 0, 0.13);
    --danger:      #c01743;
    --danger-soft: rgba(192, 23, 67, 0.13);
    --danger-solid:#c01743;
    --gold:        #7d5a00;
    --gold-soft:   rgba(125, 90, 0, 0.12);
    --silver:      #5b5f6b;
    --bronze:      #8a5030;
    --pts:         #0f5bd1;
    --shadow:      0 1px 2px rgba(20,20,35,.06), 0 8px 24px rgba(20,20,35,.06);
  }
}

/* explicit toggle must win in both directions */
:root[data-theme="dark"] {
  --bg:#0b0b0e; --surface:#17181c; --raised:#212228; --raised-2:#2a2b33;
  --line:#2c2d34; --line-soft:#232429; --text:#f2f2f5; --text-2:#b6b6c1;
  --muted:#8b8b98; --accent:#2563eb; --accent-hot:#4b86f5; --accent-text:#8ec2ff;
  --accent-soft:rgba(37,99,235,.18);
  --good:#3ddc97; --good-soft:rgba(61,220,151,.12);
  --warn:#f5a524; --warn-soft:rgba(245,165,36,.13);
  --danger:#ff5c7f; --danger-soft:rgba(255,92,127,.13); --danger-solid:#c01743;
  --gold:#e8b44a; --gold-soft:rgba(232,180,74,.12);
  --silver:#b9bcc6; --bronze:#cd8b5e; --pts:#8ec2ff;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
}
:root[data-theme="light"] {
  --bg:#f4f4f7; --surface:#ffffff; --raised:#ffffff; --raised-2:#eeeef3;
  --line:#e2e2ea; --line-soft:#ececf2; --text:#16161c; --text-2:#45454f;
  --muted:#6f6f7d; --accent:#0f5bd1; --accent-hot:#1d6ae5; --accent-text:#0f5bd1;
  --accent-soft:rgba(15,91,209,.10);
  --good:#0f7a52; --good-soft:rgba(15,122,82,.12);
  --warn:#8a5200; --warn-soft:rgba(138,82,0,.13);
  --danger:#c01743; --danger-soft:rgba(192,23,67,.13); --danger-solid:#c01743;
  --gold:#7d5a00; --gold-soft:rgba(125,90,0,.12);
  --silver:#5b5f6b; --bronze:#8a5030; --pts:#0f5bd1;
  --shadow:0 1px 2px rgba(20,20,35,.06), 0 8px 24px rgba(20,20,35,.06);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-hot); outline-offset: 2px; border-radius: 4px; }
svg { display: block; }

/* ============================================================
   PROTOTYPE BANNER
   ============================================================ */
.proto-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 7px 16px;
  background: var(--accent-soft);
  border-bottom: 1px solid var(--line);
  font-size: 12px; color: var(--text-2);
}
.proto-bar b { color: var(--text); font-weight: 600; }
.proto-bar .proto-sep { color: var(--muted); }

/* ============================================================
   APP SHELL
   ============================================================ */
.app { display: flex; height: calc(100vh - 33px); min-height: 560px; }

/* --- community rail --- */
.rail {
  width: var(--rail); flex: none;
  background: var(--bg);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center;
  gap: 14px; padding: 12px 0;
}
.rail-item {
  width: 38px; height: 38px; border-radius: var(--r-md);
  display: grid; place-items: center;
  font-size: 15px; font-weight: 700; letter-spacing: -.02em;
  background: var(--raised); color: var(--text-2);
  border: 1px solid transparent;
  transition: border-color .15s, color .15s;
}
.rail-item:hover { color: var(--text); border-color: var(--line); }
.rail-item.is-active {
  background: linear-gradient(150deg, var(--accent-hot), var(--accent));
  color: #fff;
}
.rail-add { border: 1px dashed var(--line); background: none; color: var(--muted); font-weight: 400; font-size: 20px; }

/* --- top bar --- */
.shell { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.topbar {
  height: var(--topbar); flex: none;
  display: flex; align-items: center; gap: 20px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.015em; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(150deg, var(--accent-hot), var(--accent));
  display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700;
}
.brand-caret { color: var(--muted); }

.nav { display: flex; gap: 4px; margin: 0 auto; }
.nav-link {
  padding: 7px 16px; border-radius: var(--r-pill);
  color: var(--text-2); font-size: 14px; font-weight: 500;
  transition: background .15s, color .15s;
}
.nav-link:hover { background: var(--raised); color: var(--text); }
.nav-link.is-active { background: var(--accent); color: var(--accent-ink); }

.topbar-right { display: flex; align-items: center; gap: 6px; }
.search {
  display: flex; align-items: center; gap: 8px;
  width: 200px; padding: 7px 14px; margin-right: 8px;
  background: var(--raised); border: 1px solid var(--line);
  border-radius: var(--r-pill); color: var(--muted); font-size: 13px;
}
.icon-btn {
  position: relative; width: 34px; height: 34px; border-radius: var(--r-md);
  display: grid; place-items: center; color: var(--text-2);
}
.icon-btn:hover { background: var(--raised); color: var(--text); }
.badge {
  position: absolute; top: 1px; right: 0;
  min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: var(--r-pill);
  background: var(--danger-solid); color: #fff;
  font-size: 10px; font-weight: 600; line-height: 17px; text-align: center;
  font-variant-numeric: tabular-nums;
}

/* --- body columns --- */
.body { flex: 1; display: flex; min-height: 0; }

.sidebar {
  width: var(--side); flex: none;
  border-right: 1px solid var(--line);
  background: var(--surface);
  overflow-y: auto; padding: 14px 12px 32px;
}
.side-group { margin-top: 20px; }
.side-group:first-child { margin-top: 0; }
.side-label {
  padding: 0 10px 8px;
  font-size: 11px; font-weight: 600; letter-spacing: .085em;
  text-transform: uppercase; color: var(--muted);
}
.side-link {
  width: 100%; display: flex; align-items: center; gap: 11px;
  padding: 8px 10px; border-radius: var(--r-md);
  color: var(--text-2); font-size: 14px; text-align: left;
  transition: background .15s, color .15s;
}
.side-link:hover { background: var(--raised); color: var(--text); }
.side-link.is-active { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
.side-link .side-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-link svg { flex: none; opacity: .75; }
.side-link.is-active svg { opacity: 1; }
.side-count {
  min-width: 20px; padding: 0 6px; border-radius: var(--r-sm);
  background: var(--raised-2); color: var(--text-2);
  font-size: 11px; font-weight: 600; line-height: 18px; text-align: center;
  font-variant-numeric: tabular-nums;
}
.side-link.is-active .side-count { background: rgba(255,255,255,.22); color: #fff; }

.main { flex: 1; overflow-y: auto; min-width: 0; }
.page-head {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 28px; border-bottom: 1px solid var(--line);
}
.page-title { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 26px 28px 64px; }
.wrap-narrow { max-width: 840px; }

/* ============================================================
   PRIMITIVES
   ============================================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
}
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 18px; border-radius: var(--r-pill);
  background: var(--accent); color: var(--accent-ink);
  font-size: 14px; font-weight: 600;
  transition: background .15s;
}
.btn:hover { background: var(--accent-hot); }
.btn-ghost {
  background: var(--raised); color: var(--text);
  border: 1px solid var(--line);
}
.btn-ghost:hover { background: var(--raised-2); }

.tabs { display: flex; gap: 8px; }
.tab {
  padding: 7px 16px; border-radius: var(--r-pill);
  background: var(--raised); color: var(--text-2);
  font-size: 13px; font-weight: 500;
}
.tab:hover { color: var(--text); }
.tab.is-active { background: var(--raised-2); color: var(--text); }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: var(--r-pill);
  background: var(--raised); border: 1px solid var(--line);
  font-size: 12px; font-weight: 500; color: var(--text-2);
}
.pill-good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.pill-accent { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); }

.avatar {
  flex: none; border-radius: var(--r-pill);
  display: grid; place-items: center;
  color: #fff; font-weight: 600; letter-spacing: -.01em;
  background: linear-gradient(150deg, var(--a1), var(--a2));
}
.progress {
  height: 6px; border-radius: var(--r-pill);
  background: var(--raised-2); overflow: hidden;
}
.progress > i {
  display: block; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--accent-hot));
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ============================================================
   FEED
   ============================================================ */
.feed-layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 24px; align-items: start; }

.composer {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; margin-bottom: 18px;
}
.composer-input { flex: 1; color: var(--muted); font-size: 14px; }
.composer-add {
  width: 32px; height: 32px; border-radius: var(--r-pill);
  background: var(--accent); color: #fff; display: grid; place-items: center;
}

.post { padding: 16px 18px 6px; margin-bottom: 18px; }
.post-head { display: flex; align-items: flex-start; gap: 11px; }
.post-meta { flex: 1; min-width: 0; }
.post-author { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 14px; font-weight: 600; }
.tag {
  padding: 2px 8px; border-radius: var(--r-sm);
  font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
}
.tag-admin { background: var(--accent); color: #fff; }
.tag-plan { background: var(--raised-2); color: var(--text-2); }
.post-sub { font-size: 12.5px; color: var(--muted); }
.post-title { margin: 14px 0 12px; font-size: 21px; font-weight: 600; letter-spacing: -.022em; }
.post-media {
  height: 300px; border-radius: var(--r-md); overflow: hidden;
  background:
    radial-gradient(120% 90% at 22% 12%, rgba(37,99,235,.42), transparent 62%),
    linear-gradient(158deg, #2a2b36, #121218);
  display: grid; place-items: center; color: var(--muted); font-size: 13px;
}
.post-foot {
  display: flex; align-items: center; gap: 18px;
  padding: 12px 2px; margin-top: 12px;
  border-top: 1px solid var(--line-soft);
  color: var(--muted); font-size: 13px;
}
.post-act { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.post-act:hover { color: var(--text); }

.rail-card { padding: 16px; margin-bottom: 18px; }
.rail-title { margin: 0 0 14px; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.ev-row { display: flex; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line-soft); text-align: left; width: 100%; }
.ev-row:first-of-type { border-top: 0; padding-top: 0; }
.ev-date {
  flex: none; width: 40px; padding: 5px 0; border-radius: var(--r-sm);
  background: var(--raised); text-align: center;
}
.ev-day { font-size: 15px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.ev-mon { font-size: 9.5px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
.ev-name { font-size: 13.5px; font-weight: 500; line-height: 1.35; }
.ev-time { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.trend-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; width: 100%; text-align: left; }
.trend-name { font-size: 13.5px; font-weight: 500; }
.trend-space { font-size: 12px; color: var(--muted); }

/* ============================================================
   COURSES
   ============================================================ */
.course-grid {
  display: grid; gap: 20px;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
}
.course-card { overflow: hidden; text-align: left; display: block; width: 100%; transition: border-color .15s, transform .15s; }
.course-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.cover {
  aspect-ratio: 16 / 9; padding: 18px;
  display: grid; align-content: center;
  background: linear-gradient(155deg, #23242e 0%, #0c0c11 100%);
  border-bottom: 1px solid var(--line);
}
.cover-text {
  font-size: 21px; font-weight: 700; line-height: 1.12; letter-spacing: -.03em;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff 25%, #8e8e9c 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.course-body { padding: 14px 16px 16px; }
.course-name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.course-group { margin-top: 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.course-foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.course-stats { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; font-size: 12.5px; color: var(--muted); }
.course-pct { font-variant-numeric: tabular-nums; }

/* ============================================================
   EVENTS
   ============================================================ */
.section-label { margin: 26px 0 14px; font-size: 17px; font-weight: 600; letter-spacing: -.015em; }
.event-hero { padding: 18px; }
.event-banner {
  height: 190px; border-radius: var(--r-md); margin-bottom: 18px;
  display: grid; place-content: center; text-align: center; gap: 6px;
  background:
    radial-gradient(90% 120% at 50% 0%, rgba(37,99,235,.28), transparent 60%),
    linear-gradient(180deg, #1a1b22, #08080b);
  border: 1px solid var(--line);
}
.banner-kicker { font-size: 26px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #ececf2; }
.banner-sub { font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.event-head { display: flex; align-items: flex-start; gap: 16px; }
.event-name { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.event-when { margin-top: 5px; font-size: 13px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; }
.event-detail { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
.event-detail h4 { margin: 0 0 8px; font-size: 15px; font-weight: 600; letter-spacing: .01em; text-transform: uppercase; }
.event-detail p { margin: 0; color: var(--text-2); font-size: 14px; max-width: 62ch; }
.event-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.event-list-row {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 18px; margin-bottom: 10px; width: 100%; text-align: left;
}
.event-list-row:hover { border-color: var(--accent); }

/* ============================================================
   LEADERBOARD
   ============================================================ */
.lb-profile { padding: 22px; }
.lb-top { display: flex; align-items: center; gap: 18px; }
.lb-name { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; text-transform: uppercase; }
.lb-rank { margin-left: auto; text-align: right; }
.lb-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: var(--r-pill);
  background: var(--gold-soft); color: var(--gold);
  font-size: 13px; font-weight: 600;
}
.lb-togo { margin-top: 7px; font-size: 12.5px; color: var(--muted); }
.level-grid {
  display: grid; gap: 16px 28px; margin-top: 24px;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
}
.level { display: flex; align-items: center; gap: 12px; }
.level-badge {
  width: 30px; height: 30px; flex: none; border-radius: var(--r-pill);
  display: grid; place-items: center;
  background: var(--raised-2); color: var(--muted);
  font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.level.is-current .level-badge { background: var(--gold-soft); color: var(--gold); }
.level-name { font-size: 14px; font-weight: 600; }
.level.is-locked .level-name { color: var(--text-2); }
.level-pts { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.lb-controls { display: flex; align-items: center; margin: 26px 0 14px; }
.lb-help { margin-left: auto; font-size: 13px; color: var(--muted); }
.lb-list { padding: 8px; }
.lb-row { display: flex; align-items: center; gap: 14px; padding: 13px 12px; border-radius: var(--r-md); width: 100%; text-align: left; }
.lb-row + .lb-row { border-top: 1px solid var(--line-soft); }
.lb-row:hover { background: var(--raised); }
.lb-medal {
  width: 26px; height: 26px; flex: none; border-radius: var(--r-pill);
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--raised-2); color: var(--text-2);
}
.lb-medal[data-place="1"] { color: var(--gold); }
.lb-medal[data-place="2"] { color: var(--silver); }
.lb-medal[data-place="3"] { color: var(--bronze); }
.lb-who { flex: 1; min-width: 0; }
.lb-who b { display: block; font-size: 14.5px; font-weight: 600; }
.lb-who span { font-size: 12.5px; color: var(--muted); }
.lb-pts { font-size: 14px; font-weight: 600; color: var(--pts); font-variant-numeric: tabular-nums; }
.lb-row.is-me { background: var(--accent-soft); }

/* ============================================================
   COURSE DETAIL
   ============================================================ */
.welcome { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
.welcome h2 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.03em; }
.block-title { margin: 0 0 12px; font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.progress-card { padding: 18px; }
.progress-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.progress-count { font-size: 15px; }
.progress-pct { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }

}

   ============================================================ */

}

.empty { padding: 44px; text-align: center; color: var(--muted); font-size: 14px; }

/* ============================================================
   MASTER — TILES, CHARTS, TABLES
   ============================================================ */
.tile-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.tile { padding: 18px; }
.tile-k { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

  margin-top: 8px; font-size: 32px; font-weight: 700;
  letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums;
}

.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; font-variant-numeric: tabular-nums; }
.delta-up { color: var(--good); }

.panel { padding: 18px; margin-top: 20px; }
.panel-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 4px; }
.panel-title { margin: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; }
.panel-note { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); max-width: 58ch; }

/* bar chart — one series, length carries magnitude, hue stays constant */
.chart { position: relative; margin-top: 20px; }
.chart-grid { position: absolute; inset: 0 0 22px 0; display: flex; flex-direction: column; justify-content: space-between; }
.chart-grid > i { display: block; height: 1px; background: var(--line-soft); }
.chart-bars { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 170px; }
.bar-slot { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; min-width: 0; }
.bar {
  width: 100%; border-radius: 4px 4px 0 0;
  background: var(--accent); transition: background .12s;
}
.bar-slot:hover .bar, .bar.is-max { background: var(--accent-hot); }
.chart-x { display: flex; gap: 2px; margin-top: 7px; }
.chart-x > span {
  flex: 1; min-width: 0; text-align: center;
  font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chart-caption { margin-top: 12px; font-size: 12.5px; color: var(--muted); }

  transition: opacity .1s; max-width: 240px;
}
.tip b { display: block; font-weight: 600; margin-bottom: 2px; }
.tip span { color: var(--muted); font-variant-numeric: tabular-nums; }

.table-wrap { overflow-x: auto; margin-top: 6px; }

table.data th {
  padding: 11px 14px; text-align: left; white-space: nowrap;

.num { text-align: right; font-variant-numeric: tabular-nums; }
.cell-who { display: flex; align-items: center; gap: 10px; }

.mini-fill { display: block; height: 100%; border-radius: 4px; background: var(--accent); }

/* status — always icon + label, never colour alone */

}
.queue-meta { margin-top: 8px; font-size: 12.5px; color: var(--muted); }

.btn-sm { padding: 6px 13px; font-size: 13px; }

.bar-tag {
  margin-bottom: 5px; text-align: center; white-space: nowrap;
  font-size: 11px; font-weight: 600; color: var(--text-2);
  font-variant-numeric: tabular-nums;
}

   BLOK EKSPLISIT

.course-body, .course-group, .course-foot, .cover-text,

   ============================================================ */

/* ============================================================
   PAGE: SEARCH
   ============================================================ */
function hi(text, q) {
  const e = esc(text);
  if (!q) return e;
  const i = e.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return e;
  return e.slice(0, i) + '<mark>' + e.slice(i, i + q.length) + '</mark>' + e.slice(i + q.length);
}

function searchAll(q) {
  const hit = s => !q || String(s).toLowerCase().includes(q.toLowerCase());
  const out = { courses: [], lessons: [], posts: [], members: [], events: [] };

  COURSES.forEach(c => { if (hit(c.name) || hit(c.group)) out.courses.push(c); });
  CURRICULUM.forEach((s, si) => s.lessons.forEach((name, li) => {
    if (hit(name)) out.lessons.push({ name, section: s.title, si, li });
  }));
  POSTS.forEach((p, i) => { if (hit(p.title) || hit(p.body)) out.posts.push({ p, i }); });
  MEMBERS.forEach((m, i) => { if (hit(m.name) || hit(m.bio)) out.members.push({ m, i }); });
  EVENTS.forEach(e => { if (hit(e.name)) out.events.push(e); });
  return out;
}

function viewSearch() {
  const q = state.searchQ;
  const r = searchAll(q);
  const total = r.courses.length + r.lessons.length + r.posts.length + r.members.length + r.events.length;

  const TABS = [
    ['all','Semua', total], ['courses','Kursus', r.courses.length], ['lessons','Pelajaran', r.lessons.length],
    ['posts','Postingan', r.posts.length], ['members','Anggota', r.members.length], ['events','Acara', r.events.length],
  ];
  const tabs = TABS.map(t =>
    `<button class="tab${state.searchTab === t[0] ? ' is-active' : ''}" data-stab="${t[0]}">${t[1]} <span class="result-n">${t[2]}</span></button>`).join('');

  const show = k => state.searchTab === 'all' || state.searchTab === k;
  const group = (k, label, rows) =>
    (show(k) && rows.length) ? `<div class="result-group">
      <div class="result-head">${label} <span class="result-n">${rows.length}</span></div>
      <section class="card">${rows.join('')}</section></div>` : '';

  const courses = r.courses.map(c => `
    <button class="result-row" data-course="${c.id}">
      <span class="act-icon">${icon(c.icon, 15)}</span>
      <span class="result-main"><span class="result-title">${hi(c.name, q)}</span>
      <span class="result-sub">Kursus · ${esc(c.group)} · ${c.lessons} pelajaran</span></span>
    </button>`);

  const lessons = r.lessons.slice(0, 6).map(l => `
    <button class="result-row" data-lesson="${l.si}:${l.li}">
      <span class="act-icon">${icon('video', 15)}</span>
      <span class="result-main"><span class="result-title">${hi(l.name, q)}</span>
      <span class="result-sub">Pelajaran · ${esc(l.section)}</span></span>
    </button>`);

  const posts = r.posts.map(o => `
    <button class="result-row">
      ${avatarHTML(o.p.author, o.p.ai, 32)}
      <span class="result-main"><span class="result-title">${hi(o.p.title, q)}</span>
      <span class="result-sub">Postingan oleh ${esc(o.p.author)} · ${esc(o.p.space)}</span></span>
    </button>`);

  const members = r.members.map(o => `
    <button class="result-row" data-member="${o.m.id}">
      ${avatarHTML(o.m.name, o.i, 32)}
      <span class="result-main"><span class="result-title">${hi(o.m.name, q)}</span>
      <span class="result-sub">${esc(o.m.role)} · Level ${o.m.level} ${esc(o.m.levelName)}</span></span>
    </button>`);

  const events = r.events.map(e => `
    <button class="result-row" data-go="events">

/* ============================================================
   MASTER — helper visual
   ============================================================ */
const fmt = n => Number(n).toLocaleString('id-ID');

const STATUS = {
  good:     ['Sehat',            'M20 6L9 17l-5-5'],
  warning:  ['Perlu perhatian',  'M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z'],
  critical: ['Berisiko tinggi',  'M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z'],
  idle:     ['Belum mulai',      'M12 21a9 9 0 100-18 9 9 0 000 18zM12 8v4l3 2'],
};
function status(kind, labelOverride) {
  const s = STATUS[kind] || STATUS.idle;
  return '<span class="status status-'+kind+'">'+
    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="'+s[1]+'"/></svg>'+
    esc(labelOverride || s[0])+'</span>';
}

/* Satu seri: panjang batang membawa besaran, warna tetap. Label langsung hanya di nilai puncak. */
function barChart(rows, opt) {
  opt = opt || {};
  const max = Math.max.apply(null, rows.map(r => r.v));
  const bars = rows.map(r => {
    const isMax = r.v === max;
    const h = Math.max(2, r.v / max * 100);
    return '<span class="bar-slot" data-tip="'+esc((r.full || r.l) + '|' + fmt(r.v) + (opt.unit || ''))+'">'+
      (isMax ? '<span class="bar-tag">'+fmt(r.v)+(opt.unit || '')+'</span>' : '')+
      '<span class="bar'+(isMax ? ' is-max' : '')+'" style="height:'+h.toFixed(1)+'%"></span></span>';
  }).join('');
  const xs = rows.map((r, i) =>
    '<span>'+((opt.every && i % opt.every) ? '' : esc(r.l))+'</span>').join('');
  return '<div class="chart">'+
    '<div class="chart-grid" aria-hidden="true"><i></i><i></i><i></i><i></i></div>'+
    '<div class="chart-bars">'+bars+'</div>'+
    '<div class="chart-x">'+xs+'</div></div>';
}

function hbars(rows) {
  const max = Math.max.apply(null, rows.map(r => r.v));
  return rows.map(r => `
    <div class="hbar-row">
      <span class="hbar-name" title="${esc(r.name)}">${esc(r.name)}</span>
      <span class="hbar-track"><span class="hbar-fill" style="width:${(r.v / max * 100).toFixed(1)}%"></span></span>
      <span class="hbar-val">${r.v}%</span>
    </div>`).join('');
}

/* ---------- tema terang / gelap ---------- */
const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>';
const MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>';

function currentTheme() {
  return document.documentElement.dataset.theme ||
    (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
}
function paintThemeBtn() {
  const dark = currentTheme() === 'dark';
  const btn = document.getElementById('theme-btn');
  btn.innerHTML = dark ? SUN : MOON;
  btn.title = dark ? 'Beralih ke mode terang' : 'Beralih ke mode gelap';
  btn.setAttribute('aria-label', btn.title);
}
document.getElementById('theme-btn').addEventListener('click', () => {
  document.documentElement.dataset.theme = currentTheme() === 'dark' ? 'light' : 'dark';
  paintThemeBtn();
});
/* ikut berubah bila tema diganti dari luar halaman */
new MutationObserver(paintThemeBtn).observe(document.documentElement, { attributeFilter: ['data-theme'] });
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', paintThemeBtn);
paintThemeBtn();

/* ---------- tooltip grafik ---------- */
const tip = document.createElement('div');
tip.className = 'tip';
tip.setAttribute('role', 'tooltip');
document.body.appendChild(tip);

document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]');
  if (!el) return;
  const parts = el.dataset.tip.split('|');
  tip.innerHTML = '<b>' + esc(parts[0]) + '</b><span>' + esc(parts[1] || '') + '</span>';
  tip.style.opacity = '1';
  const r = el.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8) + 'px';
  tip.style.top = Math.max(8, r.top - h - 8) + 'px';
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('[data-tip]')) tip.style.opacity = '0';
});

/* ---------- input pencarian ---------- */
document.addEventListener('input', e => {
  if (e.target.id !== 'search-input') return;
  state.searchQ = e.target.value;
  render();
  const el = document.getElementById('search-input');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
});

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-go],[data-course],[data-space],[data-evtab],[data-lbtab],[data-section],[data-lesson],[data-toggle-all],[data-step],[data-close-player],[data-complete],[data-role],[data-member],[data-read],[data-read-all],[data-stab],[data-sttab]');
  if (!t) return;

  if (t.dataset.role) { setRole(t.dataset.role); return; }
  if (t.dataset.member) { go('member', { memberId: t.dataset.member }); return; }
  if (t.dataset.read) { state.read.add(t.dataset.read); render(); return; }
  if (t.dataset.readAll !== undefined) {
    NOTIFS.forEach((g, gi) => g.items.forEach((_, ni) => state.read.add(gi + ':' + ni)));
    render();
    return;
  }
  if (t.dataset.stab) { state.searchTab = t.dataset.stab; render(); return; }
  if (t.dataset.sttab) { state.studentTab = t.dataset.sttab; render(); return; }

  if (t.dataset.closePlayer !== undefined) { state.player = null; render(); return; }

  if (t.dataset.step) {
    const flat = flatLessons();
    const idx = flat.findIndex(x => x.si === state.player.s && x.li === state.player.l);
    const next = flat[idx + Number(t.dataset.step)];
    if (next) { state.player = { s: next.si, l: next.li }; renderPlayer(); }
    return;
  }

  if (t.dataset.complete) {
    state.done.add(t.dataset.complete);
    const flat = flatLessons();
    const idx = flat.findIndex(x => x.si === state.player.s && x.li === state.player.l);
    const next = flat[idx + 1];
    if (next) state.player = { s: next.si, l: next.li };
    renderPlayer();
    return;
  }

  if (t.dataset.lesson) {
    const [s, l] = t.dataset.lesson.split(':').map(Number);
    if (!state.courseId) state.courseId = 'video-editing';
    state.player = { s, l };
    renderPlayer();
    return;
  }

  if (t.dataset.course) {
    go('course', { courseId: t.dataset.course, space: COURSES.find(c => c.id === t.dataset.course).name });
    return;
  }
  if (t.dataset.space) {
    const sp = t.dataset.space;
    go(sp === 'Feed' ? 'home' : state.route === 'course' ? 'course' : 'home', { space: sp });
    return;
  }
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.evtab) { state.eventTab = t.dataset.evtab; render(); return; }
  if (t.dataset.lbtab) { state.lbTab = t.dataset.lbtab; render(); return; }
  if (t.dataset.section !== undefined) {
    const si = Number(t.dataset.section);
    const i = state.openSections.indexOf(si);
    if (i === -1) state.openSections.push(si); else state.openSections.splice(i, 1);
    render();
    return;
  }
  if (t.dataset.toggleAll !== undefined) {
    state.openSections = state.openSections.length ? [] : CURRICULUM.map((_, i) => i);
    render();
    return;
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.player) { state.player = null; render(); }
});

render();
</script>
