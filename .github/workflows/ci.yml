name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_ci_password
          POSTGRES_DB: lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms -d lms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://lms:lms_ci_password@localhost:5432/lms?schema=public
      REDIS_URL: redis://localhost:6379
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      SESSION_COOKIE_SECURE: "false"
      MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Ketiganya, bukan hanya video. Tanpa dua yang terakhir, unggahan
      # thumbnail dan foto profil jatuh ke default `/data/...` dan runner —
      # yang tidak berjalan sebagai root — membalas EACCES. Ini tidak pernah
      # terlihat di mesin pengembangan, tempat `mkdir /data` berhasil.
      VIDEO_STORAGE_PATH: /tmp/lms-ci-videos
      AVATAR_STORAGE_PATH: /tmp/lms-ci-avatars
      COURSE_THUMBNAIL_STORAGE_PATH: /tmp/lms-ci-course-thumbnails
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lms/api exec prisma migrate deploy

      # Seluruh e2e memakai katalog, role, dan akun dari seed — `login()` pada
      # harness bahkan menuntut 200. Tanpa langkah ini 230 dari 235 test gagal,
      # dan gejalanya menyesatkan: login yang gagal berulang kali menabrak
      # pembatas laju jalur auth, sehingga yang terlihat 429, bukan "data tidak
      # ada". Ini tidak pernah ketahuan karena CI-nya sendiri belum pernah
      # berjalan.
      - run: pnpm --filter @lms/api run db:seed

      # Migrasi dan schema.prisma harus sepakat. Drift di sini tidak membuat
      # satu test pun merah — ia muncul belakangan sebagai perubahan siluman
      # yang menumpang pada migrasi fitur berikutnya, atau sebagai indeks yang
      # ada di schema tapi tidak pernah dibuat di database produksi.
      - name: Ensure migrations match the schema
        env:
          PGPASSWORD: lms_ci_password
        run: |
          createdb -h localhost -U lms lms_shadow
          # Path relatif terhadap apps/api, bukan akar repo: `pnpm --filter`
          # menjalankan perintahnya di direktori paketnya. Versi pertama
          # gerbang ini memakai path dari akar, sehingga ia selalu gagal
          # dengan "file or directory not found" — merah, tetapi tidak pernah
          # benar-benar memeriksa apa pun.
          diff=$(pnpm --filter @lms/api exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://lms:lms_ci_password@localhost:5432/lms_shadow?schema=public" \
            --script)
          echo "$diff"
          # Yang dinilai adalah ada tidaknya pernyataan SQL, bukan kalimat
          # "This is an empty migration" — kalimat itu milik Prisma dan dapat
          # berubah tanpa memberi tahu siapa pun, dan bila berubah gerbangnya
          # menjadi hijau selamanya tanpa ada yang menyadari.
          sisa=$(printf '%s\n' "$diff" | grep -v '^--' | grep -v '^[[:space:]]*$' || true)
          if [ -n "$sisa" ]; then
            echo "::error::schema.prisma dan migrasi tidak sepakat. Jalankan prisma migrate diff dan tambahkan migrasinya."
            exit 1
          fi

      - run: pnpm openapi:generate
      - name: Ensure generated contract is current
        run: git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Test integrasi berjalan terhadap PostgreSQL dan Redis sungguhan.
      # Worker tidak dinyalakan di CI, jadi relay-nya tidak berebut baris
      # outbox dengan test relay.
      - run: pnpm --filter @lms/api run test:e2e
      - run: pnpm --filter @lms/worker run test:e2e
      - run: pnpm build

  # Membangun image produksi lalu benar-benar menyalakannya.
  #
  # Ada satu kelas kegagalan yang lolos dari typecheck, lint, seluruh test, dan
  # `nest build`, lalu baru muncul ketika container produksi menyala: mengimpor
  # dependency transitif. Di runner CI dan mesin pengembangan `node_modules`
  # ter-hoist sehingga impornya terselesaikan; pada image produksi yang dipasang
  # dengan `pnpm install --filter @lms/api...`, sebuah paket hanya dapat
  # mengimpor apa yang tercantum di `dependencies` miliknya sendiri.
  #
  # Pada 31 Juli 2026 hal ini menjatuhkan produksi selama sembilan menit.
  # Gerbang ini menangkap seluruh kegagalan "berhasil dibangun, gagal menyala",
  # bukan hanya impor transitif.
  boot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_ci_password
          POSTGRES_DB: lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms -d lms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BOOT_ENV: >-
        -e DATABASE_URL=postgresql://lms:lms_ci_password@localhost:5432/lms?schema=public
        -e REDIS_URL=redis://localhost:6379
        -e MFA_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        -e APP_ENV=ci
        -e SESSION_COOKIE_SECURE=false
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t lms-api:ci .

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t lms-worker:ci .

      # `--network host` supaya container menjangkau service postgres dan redis
      # yang dipetakan ke localhost runner.
      - name: API harus benar-benar mendengarkan
        run: |
          docker run -d --name api-boot --network host $BOOT_ENV lms-api:ci

          # /health/live sengaja dipilih: ia tidak menyentuh dependency, jadi
          # yang diuji murni "prosesnya menyala dan menerima koneksi".
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/v1/health/live >/dev/null 2>&1; then
              echo "API menyala setelah ${i} detik."
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' api-boot)" != "true" ]; then
              echo "::error::Container API berhenti sebelum sempat mendengarkan."
              docker logs api-boot
              exit 1
            fi
            sleep 1
          done
          echo "::error::API tidak pernah menjawab health check dalam 30 detik."
          docker logs api-boot
          exit 1

      - name: Worker harus menyala tanpa keluar
        run: |
          docker run -d --name worker-boot --network host $BOOT_ENV lms-worker:ci

          # Worker tidak punya HTTP server, jadi buktinya: masih berjalan dan
          # sudah mencetak penanda siap.
          sleep 15
          if [ "$(docker inspect -f '{{.State.Running}}' worker-boot)" != "true" ]; then
            echo "::error::Container worker berhenti."
            docker logs worker-boot
            exit 1
          fi
          if ! docker logs worker-boot 2>&1 | grep -q "worker berjalan"; then
            echo "::error::Worker berjalan tetapi tidak pernah melaporkan siap."
            docker logs worker-boot
            exit 1
          fi
          echo "Worker menyala."

      - name: Log container
        if: always()
        run: |
          docker logs api-boot 2>&1 | tail -30 || true
          docker logs worker-boot 2>&1 | tail -20 || true

  # SECURITY_CONTROLS.md §11 mewajibkan dependency scan dan secret scan pada
  # setiap PR kritis. Keduanya belum pernah benar-benar berjalan.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pemindai rahasia perlu riwayat untuk membandingkan antar-commit;
          # tanpa ini ia hanya melihat satu snapshot dan melewatkan rahasia
          # yang ditambahkan lalu dihapus pada commit berikutnya.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Hanya dependency yang benar-benar sampai ke produksi yang memblokir.
      #
      # Saat gerbang ini dipasang, ada 15 advisory high di seluruh pohon
      # dependensi — 9 di antaranya menyentuh produksi. Sembilan itu diperbaiki
      # lewat `pnpm.overrides` di package.json root. Sisanya ada di rantai
      # perkakas build (eslint, jest); DoS pada linter tidak mengancam akademi
      # yang sedang berjalan, dan menggagalkan rilis karenanya hanya akan
      # membuat gerbang ini dimatikan dalam sebulan.
      - name: Dependency scan (produksi — memblokir)
        run: pnpm audit --prod --audit-level high

      # Tetap dilaporkan supaya tidak menghilang dari pandangan.
      - name: Dependency scan (termasuk perkakas — hanya laporan)
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: pytest
