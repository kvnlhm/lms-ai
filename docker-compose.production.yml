services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ${ENV_FILE:-.env.production}
    command: ['pnpm', '--filter', '@lms/api', 'exec', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ${ENV_FILE:-.env.production}
    restart: unless-stopped
    volumes:
      - video-data:/data/videos
      - avatar-data:/data/avatars
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: ${ENV_FILE:-.env.production}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    restart: unless-stopped
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:3001
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      VIDEO_MAX_UPLOAD_BYTES: ${VIDEO_MAX_UPLOAD_BYTES}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      - video-data:/data/videos:ro
    depends_on:
      - web
    networks: [backend]

  certbot:
    image: certbot/certbot:latest
    profiles: [ops]
    ports:
      - '80:80'
    volumes:
      - letsencrypt:/etc/letsencrypt
    entrypoint: certbot

networks:
  backend:
    internal: true

volumes:
  postgres-data:
  redis-data:
  video-data:
  avatar-data:
  letsencrypt:
  certbot-webroot:
